[project]
name = "benchcad-vision2code"
description = "BenchCAD Vision2Code — image of a mechanical part -> CadQuery program, scored by voxel IoU on the executed STEP solid (no judge)."
tags = ["eval", "vision", "code", "cad", "multimodal"]
version = "0.1.2"
# 3.11-3.12 only: numpy 1.26.4 (pinned below, required by cadquery 2.3.0) ships no
# cp313 wheel, and neither does nlopt 2.7.1. Declaring <3.14 made `prime env
# install` pick 3.13 and fail to resolve. (reported in #48)
requires-python = ">=3.11,<3.13"
dependencies = [
    "verifiers>=0.1.6",
    "datasets>=4.0.0",
    "pillow>=10.0.0",
    # CadQuery execution + voxel IoU. These are pinned to the exact, known-good
    # set resolved by BenchCAD/BenchCAD-main — the CAD stack (cadquery 2.3 needs
    # numpy<2; nlopt/scipy lean toward numpy 2) only resolves at specific versions,
    # so loose ranges silently break (e.g. a newer scipy needs np.long, gone in
    # numpy 1.26). Do not loosen without re-resolving against numpy 1.26.4.
    #
    # This list must resolve *on its own*, from wheel metadata alone: a consumer
    # runs `uv pip install benchcad-vision2code` from the Prime hub into a bare
    # venv, where none of this project's uv config exists. See tests/test_env_packages.py.
    "cadquery==2.3.0",
    "cadquery-ocp==7.9.3.0",
    "trimesh==4.12.2",
    "numpy==1.26.4",
    "scipy==1.17.1",
    # cadquery 2.3.0 imports these at runtime but doesn't declare them
    "multimethod==2.0.2",
    "typish==1.9.3",
    "nptyping==2.5.0",
    "ezdxf==1.4.3",
    # nlopt 2.8.0+ declares numpy>=2,<3 — irreconcilable with the numpy==1.26.4
    # cadquery 2.3.0 needs, so a bare `uv pip install` of this package cannot
    # resolve. 2.7.1 is the last release declaring numpy>=1.14 and is API-compatible
    # with what cadquery's sketch solver calls. (Caveat: 2.7.1 publishes no macOS
    # arm64 wheel, so Apple Silicon builds it from source; Linux/Windows/mac-x86
    # get wheels, and the RL hosts this environment targets are Linux x86_64.)
    "nlopt==2.7.1",
    "casadi==3.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE: deliberately no `[tool.uv] override-dependencies` here. It used to carry
# `numpy==1.26.4` to paper over the nlopt conflict, which worked when *developing*
# in this directory and not at all for anyone installing the published wheel —
# uv overrides are workspace config and are never written into wheel metadata.
# Whatever this package needs to resolve has to live in `dependencies` above.
